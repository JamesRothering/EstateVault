# Isolated review stack: empty Firefly + Estate. Separate volumes from stable.
#   docker compose -p estatevault-review -f docker-compose.review.yml up -d

services:
  db:
    image: mariadb:lts
    container_name: estatevault_review_db
    restart: unless-stopped
    environment:
      # Pinned: runner checkouts bootstrap a new .env each job; the volume keeps the first password.
      MYSQL_USER: firefly
      MYSQL_PASSWORD: estatevault_review_only
      MYSQL_DATABASE: firefly
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - firefly_iii_db:/var/lib/mysql
    networks:
      - estatevault
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 36
      start_period: 600s

  firefly:
    image: fireflyiii/core:latest
    container_name: estatevault_review_firefly
    hostname: app
    restart: unless-stopped
    env_file: .env
    environment:
      APP_URL: http://127.0.0.1:8180
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: firefly
      DB_USERNAME: firefly
      DB_PASSWORD: estatevault_review_only
    ports:
      - "8180:8080"
    volumes:
      - firefly_iii_upload:/var/www/html/storage/upload
    depends_on:
      db:
        condition: service_healthy
    networks:
      - estatevault

  estate:
    image: python:3.12-slim
    container_name: estatevault_review_estate
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
    command: ["python3", "-m", "estate"]
    environment:
      FIREFLY_URL: http://firefly:8080
      FIREFLY_TOKEN: ${FIREFLY_TOKEN:-}
      FRESHNESS_THRESHOLD_DAYS: ${FRESHNESS_THRESHOLD_DAYS:-30}
      WARNING_LEAD_DAYS: ${WARNING_LEAD_DAYS:-7}
      ESTATE_HOST: 0.0.0.0
      ESTATE_PORT: "8090"
    ports:
      - "8190:8090"
    depends_on:
      - firefly
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/api/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - estatevault

volumes:
  firefly_iii_upload:
    name: estatevault_review_firefly_iii_upload
  firefly_iii_db:
    name: estatevault_review_firefly_iii_db

networks:
  estatevault:
    name: estatevault_review
    driver: bridge
